<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>동물 친구들의 1분 피트스톱 챌린지</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Malgun Gothic', sans-serif; }
        body { background-color: #f0f4f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: auto; color: #333; padding: 20px; }
        
        .game-layout {
            display: flex; gap: 20px; width: 100%; max-width: 1100px; justify-content: center; align-items: flex-start;
        }

        .game-container {
            flex: 1; max-width: 780px; height: 500px;
            background: #e0f7fa; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            position: relative; overflow: hidden; display: flex; flex-direction: column;
            border: 4px solid #fff; transition: background 0.5s ease, border-color 0.5s ease;
        }

        /* Fever Time Theme */
        .game-container.fever-mode {
            background: linear-gradient(135deg, #fff3e0 0%, #ffe0b2 100%);
            border-color: #ff9800;
            box-shadow: 0 0 25px rgba(255, 152, 0, 0.4);
        }

        /* Sidebar Leaderboard */
        .sidebar-ranking {
            width: 250px; height: 500px; background: #ffffff; border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); border: 4px solid #fff;
            display: flex; flex-direction: column; padding: 18px; text-align: center;
        }
        .sidebar-ranking h3 {
            font-size: 18px; color: #2c3e50; margin-bottom: 12px;
        }
        .side-ranking-list {
            list-style: none; flex: 1; overflow-y: auto; text-align: left; padding: 0; margin: 0;
        }
        .side-ranking-list li {
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px 10px; margin-bottom: 6px; background: #f8f9fa; border-radius: 10px;
            font-size: 14px; border: 1px solid #edf2f7;
        }

        /* HUD */
        .hud {
            position: absolute; top: 15px; right: 20px; display: flex; gap: 10px; z-index: 10;
        }
        .hud-box {
            background: #ffffff; padding: 8px 14px; border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); font-weight: bold; font-size: 14px;
            border: 2px solid #e0e0e0; transition: all 0.3s;
        }
        .hud-box.fever-timer {
            background: #ff9800; color: #fff; border-color: #f57c00;
            animation: pulse 0.8s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }

        /* Fever Banner (우측 상단 콤보 옆 은은한 배너) */
        .fever-banner {
            position: absolute; top: 15px; left: 20px;
            background: linear-gradient(45deg, #ff5722, #ff9800); color: white;
            padding: 8px 16px; border-radius: 20px; font-weight: 900; font-size: 15px;
            box-shadow: 0 4px 12px rgba(255, 87, 34, 0.4);
            display: flex; align-items: center; gap: 6px;
            opacity: 0; transform: translateY(-10px); transition: all 0.4s ease; z-index: 10;
        }
        .fever-banner.show {
            opacity: 1; transform: translateY(0);
            animation: glow 1s infinite alternate;
        }

        @keyframes glow {
            from { box-shadow: 0 0 8px #ff5722; }
            to { box-shadow: 0 0 18px #ff9800; }
        }

        /* Screens */
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: #ffffff; z-index: 20; text-align: center; padding: 20px;
        }
        .screen.hidden { display: none !important; }

        h1 { font-size: 26px; color: #2c3e50; margin-bottom: 15px; }
        p { font-size: 15px; color: #555; margin-bottom: 25px; line-height: 1.5; }

        .btn {
            background: #ff7043; color: white; border: none; padding: 14px 32px;
            font-size: 18px; font-weight: bold; border-radius: 30px; cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 112, 67, 0.3); transition: background 0.2s;
        }
        .btn:hover { background: #f4511e; }

        /* Countdown Overlay */
        .countdown-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            background: rgba(255, 255, 255, 0.9); z-index: 30;
        }
        .countdown-screen.hidden { display: none !important; }
        .countdown-text {
            font-size: 96px; font-weight: 900; color: #ff7043;
        }

        /* Game Arena */
        .arena {
            flex: 1; position: relative; display: flex; flex-direction: column; justify-content: center; align-items: center; overflow: hidden;
        }

        .garage {
            position: relative; width: 360px; height: 160px; background: #fff;
            border-radius: 20px; display: flex; justify-content: center; align-items: center; border: 3px dashed #b0bec5; overflow: hidden;
        }

        .car { font-size: 55px; position: relative; transform: scaleX(-1); }
        
        .car.drive-out { animation: driveOut 0.35s ease-in forwards; }
        .car.drive-in { animation: driveIn 0.35s ease-out forwards; }

        @keyframes driveOut {
            0% { transform: translateX(0) scaleX(-1); opacity: 1; }
            100% { transform: translateX(280px) scaleX(-1); opacity: 0; }
        }

        @keyframes driveIn {
            0% { transform: translateX(-280px) scaleX(-1); opacity: 0; }
            100% { transform: translateX(0) scaleX(-1); opacity: 1; }
        }

        .crew { position: absolute; bottom: 10px; font-size: 36px; }
        .crew.left { left: 30px; }
        .crew.right { right: 30px; }

        .mission-info {
            margin-top: 15px; font-size: 16px; font-weight: bold; color: #37474f;
            background: #ffffff; padding: 8px 18px; border-radius: 12px;
        }

        .progress-bar-container {
            width: 280px; height: 22px; background: #e0e0e0; border-radius: 12px;
            margin-top: 10px; overflow: hidden; position: relative; border: 2px solid #ccc;
        }
        .progress-bar {
            height: 100%; width: 0%; background: #4caf50; border-radius: 8px; transition: width 0.05s linear;
        }
        .target-zone {
            position: absolute; width: 20%; height: 100%; background: rgba(255, 235, 59, 0.7);
            border-left: 2px dashed #fbc02d; border-right: 2px dashed #fbc02d;
        }

        .feedback {
            position: absolute; top: 20%; font-size: 26px; font-weight: bold; color: #ffca28;
            pointer-events: none; opacity: 0; transition: opacity 0.2s; z-index: 5;
        }
        .feedback.show { opacity: 1; }

        .combo-toast {
            position: absolute; top: 10%; background: #ff7043; color: white;
            padding: 6px 18px; border-radius: 20px; font-weight: bold; font-size: 15px;
            opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 15;
        }
        .combo-toast.show { opacity: 1; }

        .controls {
            padding: 15px; background: #ffffff; display: flex; justify-content: center; align-items: center; border-top: 2px solid #e0e0e0;
        }
        .push-btn {
            background: #42a5f5; color: white; border: none; padding: 14px 40px;
            font-size: 18px; font-weight: bold; border-radius: 25px; cursor: pointer;
            width: 100%; max-width: 360px; user-select: none;
        }
        .push-btn:active { background: #1e88e5; }
    </style>
</head>
<body>

<div class="game-layout">
    <div class="game-container" id="game-container">
        <!-- FEVER BANNER (상단 좌측 방해 안되는 위치에 상시/피버 노출) -->
        <div class="fever-banner" id="fever-banner">
            🔥 FEVER TIME! (점수 2배)
        </div>

        <!-- HUD -->
        <div class="hud">
            <div class="hud-box">🔥 <span id="combo-count">0</span> COMBO</div>
            <div class="hud-box" id="timer-box">⏳ <span id="timer">60</span>초</div>
            <div class="hud-box">⭐ <span id="score">0</span>점</div>
        </div>

        <!-- START SCREEN -->
        <div id="start-screen" class="screen">
            <h1>🐰 동물 친구들의 피트스톱 챌린지 🚗</h1>
            <p>스페이스바(또는 PUSH 버튼) 하나로 차를 빠르게 정비하세요!<br>전기차(클릭), 수소트럭(꾹 누르기), 스포츠카(다다닥 연타)<br><strong>마지막 10초는 피버타임 (점수 2배!)</strong></p>
            <button class="btn" id="start-btn-main">게임 시작하기</button>
        </div>

        <!-- COUNTDOWN OVERLAY -->
        <div id="countdown-screen" class="countdown-screen hidden">
            <div id="countdown-number" class="countdown-text">3</div>
        </div>

        <!-- TIMEOUT SCREEN -->
        <div id="timeout-screen" class="screen hidden">
            <h1>⏰ TIME OUT!</h1>
            <p>총 획득 점수: <strong id="final-score">0</strong>점</p>
            <div style="margin-bottom: 15px;">
                <input type="text" id="player-name" placeholder="닉네임 (3글자)" maxlength="3" style="padding: 8px; font-size: 16px; text-align: center; width: 140px;">
                <button class="btn" style="padding: 8px 16px; font-size: 14px;" id="save-score-btn">등록</button>
            </div>
            <button class="btn" id="restart-btn">다시 하기</button>
        </div>

        <!-- GAME ARENA -->
        <div class="arena">
            <div id="combo-toast" class="combo-toast">🔥 10 COMBO BONUS! (+200)</div>
            <div id="feedback" class="feedback">PERFECT!</div>
            <div class="garage">
                <div class="crew left">🐰</div>
                <div id="car-obj" class="car">🚗</div>
                <div class="crew right">🐹</div>
            </div>
            <div id="mission-title" class="mission-info">미션 대기 중...</div>
            <div class="progress-bar-container" id="bar-container" style="display:none;">
                <div class="target-zone" id="target-zone"></div>
                <div id="progress-bar" class="progress-bar"></div>
            </div>
        </div>

        <!-- CONTROLS -->
        <div class="controls">
            <button class="push-btn" id="action-btn">[ PUSH! ] (스페이스바)</button>
        </div>
    </div>

    <!-- Sidebar Ranking List -->
    <div class="sidebar-ranking">
        <h3>🏆 실시간 Top 5</h3>
        <ul id="side-ranking-list" class="side-ranking-list">
            <li><span>등록된 기록이 없습니다.</span></li>
        </ul>
        <button class="btn" style="background: #9e9e9e; padding: 8px 14px; font-size: 13px; margin-top: 10px;" id="reset-rank-btn">랭킹 초기화</button>
    </div>
</div>

<script>
    window.onload = function() {
        let score = 0;
        let combo = 0;
        let timeLeft = 60;
        let timerInterval = null;
        let isPlaying = false;
        let isCountingDown = false;
        let isTransitioning = false;
        let isHolding = false;
        let isFeverTime = false;
        
        let currentCar = null;
        let lastCarIndex = -1;
        let missionType = '';
        let holdProgress = 0;
        let holdInterval = null;
        let mashCount = 0;
        let targetMash = 4;
        let timingPos = 0;
        let timingDir = 1;
        let timingInterval = null;

        let targetStart = 70;
        let targetEnd = 90;

        const cars = [
            { name: "쪼꼬미 전기차", emoji: "🚗", type: "click", desc: "노란 타겟 구간에 올 때 버튼 찰칵!" },
            { name: "듬직한 수소 트럭", emoji: "🚚", type: "hold", desc: "버튼을 꾹~ 누르고 있다가 노란 구간에서 손 떼기!" },
            { name: "스포티 스포츠카", emoji: "🏎️", type: "mash", desc: "버튼을 다다닥 연타하여 게이지를 채우세요!" }
        ];

        loadRanking();

        document.getElementById('start-btn-main').onclick = triggerCountdown;
        document.getElementById('restart-btn').onclick = triggerCountdown;
        document.getElementById('save-score-btn').onclick = saveScore;
        document.getElementById('reset-rank-btn').onclick = resetRanking;

        function triggerCountdown() {
            if(isCountingDown || isPlaying) return;
            isCountingDown = true;
            
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('timeout-screen').classList.add('hidden');
            
            const countdownScreen = document.getElementById('countdown-screen');
            const countdownNum = document.getElementById('countdown-number');
            countdownScreen.classList.remove('hidden');

            let count = 3;
            countdownNum.innerText = count;

            let cdInterval = setInterval(() => {
                count--;
                if(count > 0) {
                    countdownNum.innerText = count;
                } else if(count === 0) {
                    countdownNum.innerText = "GO!";
                } else {
                    clearInterval(cdInterval);
                    countdownScreen.classList.add('hidden');
                    isCountingDown = false;
                    startGame();
                }
            }, 800);
        }

        function startGame() {
            score = 0;
            combo = 0;
            timeLeft = 60;
            isPlaying = true;
            isTransitioning = false;
            isFeverTime = false;
            lastCarIndex = -1;
            
            // 피버 모드 관련 클래스 및 UI 초기화
            document.getElementById('game-container').classList.remove('fever-mode');
            document.getElementById('timer-box').classList.remove('fever-timer');
            document.getElementById('fever-banner').classList.remove('show');

            updateScore();
            updateCombo(false);
            document.getElementById('timer').innerText = timeLeft;

            if(timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').innerText = timeLeft;

                // 마지막 10초 진입 시 피버타임 발동!
                if(timeLeft <= 10 && !isFeverTime) {
                    triggerFeverTime();
                }

                if(timeLeft <= 0) endGame();
            }, 1000);

            spawnCarDirectly();
        }

        function triggerFeverTime() {
            isFeverTime = true;
            // 1. 전체 화면 배경 파스텔 웜톤+주황 테두리로 반짝 변경
            document.getElementById('game-container').classList.add('fever-mode');
            // 2. 타이머 박스 불빛 펄스 애니메이션
            document.getElementById('timer-box').classList.add('fever-timer');
            // 3. 상단 좌측 은은하고 화려한 🔥 FEVER TIME (점수 2배) 배너 등장
            document.getElementById('fever-banner').classList.add('show');
            
            showFeedback("🔥 FEVER TIME! 2X SCORE! 🔥");
        }

        function spawnCarDirectly() {
            let nextIndex;
            do {
                nextIndex = Math.floor(Math.random() * cars.length);
            } while (nextIndex === lastCarIndex && cars.length > 1);

            lastCarIndex = nextIndex;
            currentCar = cars[nextIndex];
            missionType = currentCar.type;

            const carObj = document.getElementById('car-obj');
            carObj.className = 'car';
            carObj.innerText = currentCar.emoji;

            setupMissionUI();
        }

        function randomizeTargetZone() {
            targetStart = Math.floor(Math.random() * 46) + 30;
            targetEnd = targetStart + 18;
            
            const targetZoneEl = document.getElementById('target-zone');
            targetZoneEl.style.left = targetStart + '%';
            targetZoneEl.style.width = '18%';
        }

        function transitionToNextCar() {
            if(!isPlaying || isTransitioning) return;
            isTransitioning = true;

            const carObj = document.getElementById('car-obj');
            carObj.className = 'car drive-out';

            setTimeout(() => {
                if(!isPlaying) return;

                let nextIndex;
                do {
                    nextIndex = Math.floor(Math.random() * cars.length);
                } while (nextIndex === lastCarIndex && cars.length > 1);

                lastCarIndex = nextIndex;
                currentCar = cars[nextIndex];
                missionType = currentCar.type;

                carObj.innerText = currentCar.emoji;
                carObj.className = 'car drive-in';

                setupMissionUI();

                setTimeout(() => {
                    carObj.className = 'car';
                    isTransitioning = false;
                }, 350);

            }, 350);
        }

        function setupMissionUI() {
            const barContainer = document.getElementById('bar-container');
            barContainer.style.display = 'block';
            document.getElementById('progress-bar').style.width = '0%';

            if(missionType === 'click' || missionType === 'hold') {
                document.getElementById('target-zone').style.display = 'block';
                document.getElementById('mission-title').innerText = `[${currentCar.name}] - ${currentCar.desc}`;
                randomizeTargetZone();

                if(missionType === 'click') {
                    timingPos = 0;
                    timingDir = 2.5;
                    if(timingInterval) clearInterval(timingInterval);
                    timingInterval = setInterval(() => {
                        timingPos += timingDir;
                        if(timingPos >= 100 || timingPos <= 0) timingDir *= -1;
                        document.getElementById('progress-bar').style.width = timingPos + '%';
                    }, 20);
                }
            } else {
                document.getElementById('target-zone').style.display = 'none';
                mashCount = 0;
                targetMash = Math.floor(Math.random() * 4) + 3;
                document.getElementById('mission-title').innerText = `[${currentCar.name}] - 버튼을 ${targetMash}번 연타하세요!`;
            }
        }

        function updateCombo(increase = true) {
            if(increase) {
                combo++;
                if(combo > 0 && combo % 10 === 0) {
                    showComboToast(`🔥 ${combo} COMBO BONUS! (+200)`);
                    score += isFeverTime ? 400 : 200; // 피버 타임일 때 콤보 보너스도 2배!
                    updateScore();
                }
            } else {
                combo = 0;
            }
            document.getElementById('combo-count').innerText = combo;
        }

        function showComboToast(text) {
            const toast = document.getElementById('combo-toast');
            toast.innerText = text;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 1200);
        }

        function calculateScore(baseScore) {
            let finalPoints = baseScore + Math.floor(baseScore * (combo * 0.1));
            // 피버 타임일 때 획득 점수 2배 배율 적용!
            if(isFeverTime) {
                finalPoints *= 2;
            }
            return finalPoints;
        }

        function onPressStart() {
            if(!isPlaying || isCountingDown || isTransitioning) return;

            if(missionType === 'click') {
                if(timingInterval) clearInterval(timingInterval);

                if(timingPos >= targetStart && timingPos <= targetEnd) {
                    updateCombo(true);
                    let addedScore = calculateScore(300);
                    showFeedback(`PERFECT! +${addedScore}${isFeverTime ? ' 🔥2X' : ''}`);
                    score += addedScore;
                } else if(timingPos >= (targetStart - 12) && timingPos <= (targetEnd + 12)) {
                    updateCombo(true);
                    let addedScore = calculateScore(150);
                    showFeedback(`GREAT! +${addedScore}${isFeverTime ? ' 🔥2X' : ''}`);
                    score += addedScore;
                } else {
                    updateCombo(false);
                    let addedScore = isFeverTime ? 100 : 50;
                    showFeedback(`NICE! +${addedScore}`);
                    score += addedScore;
                }
                updateScore();
                transitionToNextCar();
            } 
            else if(missionType === 'hold' && !isHolding) {
                isHolding = true;
                holdProgress = 0;
                if(holdInterval) clearInterval(holdInterval);
                holdInterval = setInterval(() => {
                    holdProgress += 2.5;
                    if(holdProgress > 100) holdProgress = 100;
                    document.getElementById('progress-bar').style.width = holdProgress + '%';
                }, 25);
            } 
            else if(missionType === 'mash') {
                mashCount++;
                let mashPercent = Math.min(Math.floor((mashCount / targetMash) * 100), 100);
                document.getElementById('progress-bar').style.width = mashPercent + '%';
                
                if(mashCount >= targetMash) {
                    updateCombo(true);
                    let basePoints = 300 + (targetMash - 3) * 50;
                    let addedScore = calculateScore(basePoints);
                    showFeedback(`PERFECT! +${addedScore}${isFeverTime ? ' 🔥2X' : ''}`);
                    score += addedScore;
                    updateScore();
                    transitionToNextCar();
                }
            }
        }

        function onPressEnd() {
            if(!isPlaying || isCountingDown || isTransitioning) return;

            if(missionType === 'hold' && isHolding) {
                isHolding = false;
                if(holdInterval) clearInterval(holdInterval);

                if(holdProgress >= targetStart && holdProgress <= targetEnd) {
                    updateCombo(true);
                    let addedScore = calculateScore(350);
                    showFeedback(`PERFECT! +${addedScore}${isFeverTime ? ' 🔥2X' : ''}`);
                    score += addedScore;
                } else if(holdProgress >= (targetStart - 12) && holdProgress <= (targetEnd + 12)) {
                    updateCombo(true);
                    let addedScore = calculateScore(180);
                    showFeedback(`GREAT! +${addedScore}${isFeverTime ? ' 🔥2X' : ''}`);
                    score += addedScore;
                } else {
                    updateCombo(false);
                    let addedScore = isFeverTime ? 140 : 70;
                    showFeedback(`NICE! +${addedScore}`);
                    score += addedScore;
                }
                updateScore();
                transitionToNextCar();
            }
        }

        const pushBtn = document.getElementById('action-btn');
        pushBtn.onmousedown = onPressStart;
        pushBtn.onmouseup = onPressEnd;
        pushBtn.ontouchstart = function(e) { e.preventDefault(); onPressStart(); };
        pushBtn.ontouchend = function(e) { e.preventDefault(); onPressEnd(); };

        let spacePressed = false;
        window.onkeydown = function(e) {
            if(e.code === 'Space' && !spacePressed) {
                e.preventDefault();
                spacePressed = true;
                if(isPlaying) onPressStart();
            }
        };

        window.onkeyup = function(e) {
            if(e.code === 'Space') {
                e.preventDefault();
                spacePressed = false;
                if(isPlaying) onPressEnd();
            }
        };

        function showFeedback(text) {
            const fb = document.getElementById('feedback');
            fb.innerText = text;
            fb.classList.add('show');
            setTimeout(() => fb.classList.remove('show'), 400);
        }

        function updateScore() {
            document.getElementById('score').innerText = score;
        }

        function endGame() {
            isPlaying = false;
            isHolding = false;
            isTransitioning = false;
            isFeverTime = false;
            if(timerInterval) clearInterval(timerInterval);
            if(timingInterval) clearInterval(timingInterval);
            if(holdInterval) clearInterval(holdInterval);

            document.getElementById('final-score').innerText = score;
            document.getElementById('timeout-screen').classList.remove('hidden');
        }

        function saveScore() {
            let name = document.getElementById('player-name').value || '익명';
            let rankings = JSON.parse(localStorage.getItem('pitstop_rankings') || '[]');
            rankings.push({ name: name, score: score });
            rankings.sort((a, b) => b.score - a.score);
            rankings = rankings.slice(0, 5);
            localStorage.setItem('pitstop_rankings', JSON.stringify(rankings));
            loadRanking();
        }

        function loadRanking() {
            let rankings = JSON.parse(localStorage.getItem('pitstop_rankings') || '[]');
            let list = document.getElementById('side-ranking-list');
            list.innerHTML = '';
            if(rankings.length === 0) {
                list.innerHTML = '<li><span>등록된 기록이 없습니다.</span></li>';
                return;
            }
            rankings.forEach((r, idx) => {
                let li = document.createElement('li');
                li.innerHTML = `<span>${idx+1}. ${r.name}</span> <strong>${r.score}점</strong>`;
                list.appendChild(li);
            });
        }

        function resetRanking() {
            localStorage.removeItem('pitstop_rankings');
            loadRanking();
        }
    };
</script>

</body>
</html>
